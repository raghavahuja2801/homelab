apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: plantuml
  namespace: infrastructure

spec:
  ingressClassName: traefik

  rules:
  - host: plantuml.lab

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: plantuml

            port:
              number: 80
