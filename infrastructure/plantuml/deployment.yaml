apiVersion: apps/v1
kind: Deployment

metadata:
  name: plantuml
  namespace: infrastructure

spec:
  replicas: 1

  selector:
    matchLabels:
      app: plantuml

  template:
    metadata:
      labels:
        app: plantuml

    spec:
      containers:
      - name: plantuml
        image: plantuml/plantuml-server:jetty

        ports:
        - containerPort: 8080
