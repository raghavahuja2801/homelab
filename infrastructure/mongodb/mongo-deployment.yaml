apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8

          ports:
            - containerPort: 27017

          env:
            # Kernel 6.19+ breaks the rseq ABI that MongoDB's bundled TCMalloc
            # relies on, so mongod aborts at startup (SERVER-121912).
            # Re-enabling rseq for glibc works around it until the fix ships.
            - name: GLIBC_TUNABLES
              value: glibc.pthread.rseq=1

          envFrom:
            - secretRef:
                name: mongodb-secret

          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
