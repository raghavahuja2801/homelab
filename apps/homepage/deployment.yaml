apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        imagePullPolicy: IfNotPresent

        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: home.lab
        - name: TZ
          value: "Asia/Kolkata"

        # Widget credentials, referenced in services.yaml as {{HOMEPAGE_VAR_*}}.
        # The Secret lives in secret.yaml, which is gitignored.
        envFrom:
        - secretRef:
            name: homepage-secret

        ports:
        - containerPort: 3000
          name: http

        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10

        volumeMounts:
        # Config lives directly on the node so "cp config/*.yaml /opt/homepage/config && restart" works
        - name: config
          mountPath: /app/config
          readOnly: true

        # Homepage writes its runtime logs to /app/config/logs
        - name: logs
          mountPath: /app/config/logs

        # Disks shown in the resources widget
        - name: nas
          mountPath: /mnt/nas
          readOnly: true
        - name: storage
          mountPath: /mnt/storage
          readOnly: true
        - name: jellyfin-media
          mountPath: /mnt/jellyfin-data
          readOnly: true

      volumes:
      - name: config
        hostPath:
          path: /opt/homepage/config
          type: Directory

      - name: logs
        emptyDir: {}

      - name: nas
        hostPath:
          path: /mnt/nas
          type: Directory
      - name: storage
        hostPath:
          path: /mnt/storage
          type: Directory
      - name: jellyfin-media
        hostPath:
          path: /mnt/jellyfin-data
          type: Directory
