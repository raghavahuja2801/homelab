- Media:
    - Jellyfin:
        href: http://jellyfin.lab
        icon: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin.jellyfin.svc.cluster.local:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          enableMediaControl: false
          showEpisodeNumber: true
          expandOneStreamToTwoRows: false

    - Torrents:
        icon: https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/New_qBittorrent_Logo.svg/960px-New_qBittorrent_Logo.svg.png
