# values.yaml - Production ready
replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest
  pullPolicy: IfNotPresent

# The key fix: mount your config directory properly
extraVolumes:
  - name: config
    hostPath:
      path: /opt/homepage/config  # Change this to your actual path
      type: Directory

extraVolumeMounts:
  - name: config
    mountPath: /app/config
    readOnly: true

# Service with NodePort for easy access (change to ClusterIP if using ingress)
service:
  type: NodePort
  port: 3000
  nodePort: 30080

# Health checks
livenessProbe:
  enabled: true
  path: /healthcheck
  port: 3000

readinessProbe:
  enabled: true
  path: /healthcheck
  port: 3000

# Resources - set these based on your node
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Ingress if you want it (uncomment and configure)
# ingress:
#   enabled: true
#   className: "traefik"
#   hosts:
#     - host: home.example.com
#       paths:
#         - path: /
#           pathType: Prefix

# Environment variables if needed
env:
  - name: TZ
    value: "America/New_York"  # Change to your timezone
  - name: LOG_LEVEL
    value: "info"
