apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: n8n
  namespace: n8n

spec:
  ingressClassName: traefik

  rules:
  - host: n8n.lab

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: n8n
            port:
              number: 80
