apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qdrant
  namespace: qdrant

spec:
  ingressClassName: traefik

  rules:
    - host: qdrant.lab

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: qdrant
                port:
                  number: 6333
