apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: qdrant
spec:
  replicas: 1

  selector:
    matchLabels:
      app: qdrant

  template:
    metadata:
      labels:
        app: qdrant

    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.15.4

          ports:
            - containerPort: 6333
            - containerPort: 6334

          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 2Gi

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
