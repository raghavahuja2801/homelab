apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"

          envFrom:
            - secretRef:
                name: minio-secret

          ports:
            - containerPort: 9000
            - containerPort: 9001

          volumeMounts:
            - mountPath: /data
              name: storage

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: minio-pvc
