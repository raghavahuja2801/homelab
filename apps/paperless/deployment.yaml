apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          ports:
            - containerPort: 8000
          env:
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_REDIS
              value: redis://redis.redis.svc.cluster.local:6379

            - name: PAPERLESS_DBHOST
              value: postgres.postgres.svc.cluster.local

            - name: PAPERLESS_DBPORT
              value: "5432"

            - name: PAPERLESS_DBNAME
              value: paperless

            - name: PAPERLESS_DBUSER
              value: paperless

            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_DBPASS

            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_SECRET_KEY

            - name: PAPERLESS_URL
              value: https://paperless.lab

          volumeMounts:
            - name: storage
              mountPath: /usr/src/paperless/data
              subPath: data

            - name: storage
              mountPath: /usr/src/paperless/media
              subPath: media

            - name: storage
              mountPath: /usr/src/paperless/consume
              subPath: consume

            - name: storage
              mountPath: /usr/src/paperless/export
              subPath: export

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: paperless-storage
