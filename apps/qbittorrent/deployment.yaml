apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
            - name: WEBUI_PORT
              value: "8080"

          ports:
            - containerPort: 8080
              name: web

            - containerPort: 6881
              name: torrent-tcp

            - containerPort: 6881
              protocol: UDP
              name: torrent-udp

          volumeMounts:
            - name: config
              mountPath: /config

            - name: media
              mountPath: /downloads

      volumes:
        - name: config
          hostPath:
            path: /mnt/nas
            type: DirectoryOrCreate

        - name: media
          hostPath:
            path: /mnt/nas/media
            type: Directory
