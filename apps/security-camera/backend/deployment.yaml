apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-api
  namespace: camera
spec:
  replicas: 1

  selector:
    matchLabels:
      app: camera-api

  template:
    metadata:
      labels:
        app: camera-api

    spec:
      containers:
        - name: camera-api
          image: camera-api:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - configMapRef:
                name: camera-api-config

            - secretRef:
                name: camera-credentials

          resources:
            requests:
              cpu: 25m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
