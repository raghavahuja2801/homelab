apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: camera-api
  namespace: camera
spec:
  ingressClassName: traefik

  rules:
    - host: camera.lab

      http:
        paths:
          - path: /api
            pathType: Prefix

            backend:
              service:
                name: camera-api
                port:
                  number: 8000
