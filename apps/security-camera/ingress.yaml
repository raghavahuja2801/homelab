apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: camera
  namespace: camera
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: camera.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mediamtx
                port:
                  number: 8888
