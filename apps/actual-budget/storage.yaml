apiVersion: v1
kind: PersistentVolume
metadata:
  name: actual-budget-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: actual-budget-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /srv/actual-budget
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-pvc
  namespace: actual-budget
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: actual-budget-storage
  resources:
    requests:
      storage: 5Gi
