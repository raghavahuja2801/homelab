# The ERPNext application tier. Every component runs the same image; they differ
# only in which command they run. The frontend is nginx too — since v15 Frappe
# does not publish a separate nginx image, it just overrides the entrypoint.
#
# All of these mount the shared `sites` PVC, which is how they agree on the site
# list and connection config. `strategy: Recreate` is deliberate: one replica
# each, and we never want two schedulers or two workers running at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: erpnext
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: erpnext-backend
  template:
    metadata:
      labels:
        app: erpnext-backend
    spec:
      containers:
        - name: backend
          image: frappe/erpnext:v15.121.2
          # Image default command is start.sh, which boots gunicorn on 8000.
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
              httpHeaders:
                - name: Host
                  value: janak.medical
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          env:
            - name: GUNICORN_WORKERS
              value: "4"
            - name: GUNICORN_THREADS
              value: "4"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erpnext-sites
        - name: logs
          persistentVolumeClaim:
            claimName: erpnext-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: erpnext
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: erpnext-frontend
  template:
    metadata:
      labels:
        app: erpnext-frontend
    spec:
      containers:
        - name: frontend
          image: frappe/erpnext:v15.121.2
          command:
            - nginx-entrypoint.sh
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: BACKEND
              value: backend:8000
            - name: SOCKETIO
              value: websocket:9000
            # Trust Traefik's X-Forwarded-For so logs show real client IPs.
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: 10.42.0.0/16
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erpnext-sites
        - name: logs
          persistentVolumeClaim:
            claimName: erpnext-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: erpnext
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: erpnext-websocket
  template:
    metadata:
      labels:
        app: erpnext-websocket
    spec:
      containers:
        - name: websocket
          image: frappe/erpnext:v15.121.2
          command:
            - node
            - /home/frappe/frappe-bench/apps/frappe/socketio.js
          ports:
            - name: socketio
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erpnext-sites
        - name: logs
          persistentVolumeClaim:
            claimName: erpnext-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-short
  namespace: erpnext
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: erpnext-queue-short
  template:
    metadata:
      labels:
        app: erpnext-queue-short
    spec:
      containers:
        - name: queue-short
          image: frappe/erpnext:v15.121.2
          command:
            - bench
            - worker
            - --queue
            - short,default
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erpnext-sites
        - name: logs
          persistentVolumeClaim:
            claimName: erpnext-logs
---
