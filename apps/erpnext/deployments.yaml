apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: erpnext
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: erpnext-scheduler
  template:
    metadata:
      labels:
        app: erpnext-scheduler
    spec:
      containers:
        - name: scheduler
          image: frappe/erpnext:v15.121.2
          command:
            - bench
            - schedule
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
