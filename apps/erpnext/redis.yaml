apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: erpnext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /mnt/storage/erpnext/redis/cache
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: erpnext
spec:
  selector:
    app: redis-cache
  ports:
    - port: 6379
      targetPort: 6379
---
