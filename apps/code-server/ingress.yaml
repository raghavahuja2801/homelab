apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server
  namespace: development
spec:
  ingressClassName: traefik

  rules:
  - host: code.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: code-server
            port:
              number: 8443
