apiVersion: apps/v1
kind: Deployment
metadata:
  name: myspeed
  namespace: myspeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myspeed
  template:
    metadata:
      labels:
        app: myspeed
    spec:
      containers:
        - name: myspeed
          image: germannewsmaker/myspeed:latest
          ports:
            - containerPort: 5216
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: myspeed-data
              mountPath: /myspeed/data
      volumes:
        - name: myspeed-data
          persistentVolumeClaim:
            claimName: myspeed-data
