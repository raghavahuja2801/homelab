apiVersion: apps/v1
kind: Deployment

metadata:
  name: jellyfin
  namespace: jellyfin

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jellyfin

  template:
    metadata:
      labels:
        app: jellyfin

    spec:
      containers:
      - name: jellyfin

        image: jellyfin/jellyfin:latest

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"

        ports:
        - containerPort: 8096

        volumeMounts:

        - name: config
          mountPath: /config

        - name: cache
          mountPath: /cache

        - name: media
          mountPath: /media

      volumes:

      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config

      - name: cache
        emptyDir: {}

      - name: media
        hostPath:
          path: /home/raghav-ahuja/media
          type: Directory
