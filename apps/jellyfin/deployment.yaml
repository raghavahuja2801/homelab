apiVersion: apps/v1
kind: Deployment

metadata:
  name: jellyfin
  namespace: jellyfin

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jellyfin

  template:
    metadata:
      labels:
        app: jellyfin

    spec:
      containers:
      - name: jellyfin

        image: jellyfin/jellyfin:latest

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"

        ports:
        - containerPort: 8096

        volumeMounts:

        - name: config
          mountPath: /config

        - name: cache
          mountPath: /cache

        - name: media
          mountPath: /media

        - name: dri
          mountPath: /dev/dri

      volumes:

      - name: config
        hostPath:
          path: /mnt/nas/config
          type: Directory

      - name: cache
        hostPath:
          path: /mnt/nas/cache
          type: Directory
      - name: media
        hostPath:
          path: /mnt/nas
          type: Directory

      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
